version: 2

updates:
  # Check Python dependencies once per month
  # GitHub currently applies a three-day cooldown to version updates by default
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"

  # Check GitHub Actions dependencies once per month
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
