name: "CI: Run automated tests"

on:
  # Run on pushes to `main` (avoid duplicate runs on feature branches) and on pull requests
  # Also allow manual runs from the `Actions` tab
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Ensure GITHUB_TOKEN is read-only; any unlisted permissions here are also disabled
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # GitHub Actions can sometimes freeze, so stop if this job takes more than 5 minutes
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Do not store GITHUB_TOKEN in `$RUNNER_TEMP`
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Setup Python and run pytest
        # Install Python listed in `.python-version` and the test dependencies from `uv.lock`, then execute pytest
        #
        # `--locked` = use `uv.lock` and fail if it's outdated
        # `--no-default-groups` = exclude the default `test` and `dev` groups initially (we don't want `ruff`)
        # `--group test` = explicitly include only the `test` group
        run: uv run --locked --no-default-groups --group test pytest
